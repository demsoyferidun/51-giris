<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>51 Kağıt Oyunu · Google ile giriş</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0b2018; color: #f3ead2; font: 17px/1.45 system-ui, sans-serif; }
  .box { width: min(360px, calc(100% - 32px)); padding: 26px 22px; border: 1px solid #b8963e; border-radius: 16px; background: #12362a; text-align: center; }
  h1 { margin: 0 0 6px; font-size: 26px; color: #e3b341; }
  p { margin: 10px 0; opacity: .9; }
  button, a.btn { display: block; width: 100%; box-sizing: border-box; margin-top: 16px; padding: 14px; border: 0; border-radius: 10px; font: 600 17px system-ui, sans-serif; cursor: pointer; text-decoration: none; }
  .g { background: #fff; color: #222; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .back { background: #e3b341; color: #1b1405; }
  .err { color: #ffb4a4; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div class="box">
  <h1>51</h1>
  <p id="msg">Oyuna Google hesabınla giriş yap.</p>
  <button class="g" id="go"><svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C.9 16.6 0 20.2 0 24s.9 7.4 2.6 10.7l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>Google ile giriş yap</button>
  <a class="btn back hide" id="back" href="#">▶ Oyuna dön</a>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
// Oyun bu sayfayı telefonun tarayıcısında açar (Google girişi uygulama içinde açılamıyor).
// Giriş bitince oyuna "oyun51://giris" bağlantısıyla döner; oyun girişi kendisi tamamlar.
firebase.initializeApp({ apiKey: 'AIzaSyBB67qExyUnJ6PvFH10EovzGo4i7fZbHSk', authDomain: 'oyun-f964f.firebaseapp.com', projectId: 'oyun-f964f' });
const auth = firebase.auth();
const $ = id => document.getElementById(id);
const fromHash = new URLSearchParams(location.hash.slice(1)).get('s');
if (fromHash) sessionStorage.setItem('51-s', fromHash);
const state = fromHash || sessionStorage.getItem('51-s') || '';
function done(user) {
  const q = 's=' + encodeURIComponent(state) + '&rt=' + encodeURIComponent(user.refreshToken);
  const url = 'intent://giris?' + q + '#Intent;scheme=oyun51;package=com.oyun51;end';
  $('go').classList.add('hide');
  $('msg').textContent = 'Giriş tamam (' + (user.email || '') + '). Oyuna dönmek için dokun.';
  $('back').href = url; $('back').classList.remove('hide');
  sessionStorage.removeItem('51-s');
  location.href = url; // tarayıcı izin verirse kendiliğinden döner
}
function fail(e) { $('msg').innerHTML = '<span class="err">Giriş olmadı: ' + (e && (e.code || e.message) || 'bilinmeyen hata') + '</span><br>Tekrar dene.'; $('go').classList.remove('hide'); }
if (!state) { $('msg').textContent = 'Bu sayfayı oyunun içindeki "Google ile giriş yap" düğmesiyle aç.'; $('go').classList.add('hide'); }
const provider = new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
// yönlendirmeyle girildiyse dönüşte sonucu al (hata sadece gerçekten yönlendirme yapıldıysa gösterilir)
const redir = sessionStorage.getItem('51-redir'); sessionStorage.removeItem('51-redir');
auth.getRedirectResult().then(r => { if (r && r.user) done(r.user); }).catch(e => { if (redir) fail(e); });
$('go').onclick = () => {
  $('msg').textContent = 'Google hesabını seç…';
  auth.signInWithPopup(provider).then(r => done(r.user)).catch(e => {
    if (e && /popup|operation-not-supported|web-storage/.test(e.code || '')) { sessionStorage.setItem('51-redir', '1'); auth.signInWithRedirect(provider).catch(fail); } else fail(e);
  });
};
</script>
</body>
</html>
